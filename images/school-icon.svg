<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#1a5276"/>
  
  <!-- Building base -->
  <rect x="40" y="80" width="120" height="90" fill="#f5f5f5" rx="5"/>
  
  <!-- Roof -->
  <polygon points="30,80 100,30 170,80" fill="#2980b9"/>
  
  <!-- Door -->
  <rect x="85" y="120" width="30" height="50" fill="#1a5276" rx="3"/>
  
  <!-- Windows left -->
  <rect x="50" y="95" width="20" height="20" fill="#85c1e9" rx="2"/>
  <rect x="50" y="125" width="20" height="20" fill="#85c1e9" rx="2"/>
  
  <!-- Windows right -->
  <rect x="130" y="95" width="20" height="20" fill="#85c1e9" rx="2"/>
  <rect x="130" y="125" width="20" height="20" fill="#85c1e9" rx="2"/>
  
  <!-- Flag pole -->
  <line x1="100" y1="30" x2="100" y2="10" stroke="#7f8c8d" stroke-width="3"/>
  
  <!-- Flag -->
  <polygon points="100,10 140,20 100,30" fill="#ed8936"/>
  
  <!-- School text -->
  <text x="100" y="185" text-anchor="middle" fill="white" font-family="Arial" font-size="10" font-weight="bold">SHS</text>
</svg>