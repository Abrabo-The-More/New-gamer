<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Suhum Senior High Technical School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <div class="school-logo">
                    <img src="images/school-icon.svg" alt="School Logo">
                </div>
                <h1>School Management System</h1>
                <p class="school-name">SUHUM SENIOR HIGH TECHNICAL SCHOOL</p>
                <p class="school-location"><i class="fas fa-map-marker-alt"></i> Suhum, Eastern Region, Ghana</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <div class="password-input">
                        <input type="password" id="password" placeholder="Enter password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-key"></i> Secret Code</label>
                    <input type="password" id="secretCode" placeholder="Enter secret code" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-users"></i> Login As</label>
                    <select id="userRole" required>
                        <option value="">Select Role</option>
                        <option value="admin">Administrator</option>
                        <option value="principal">Principal</option>
                        <option value="teacher">Teacher</option>
                        <option value="accountant">Accountant</option>
                        <option value="registrar">Registrar</option>
                        <option value="librarian">Librarian</option>
                        <option value="storekeeper">Storekeeper</option>
                        <option value="security">Security</option>
                        <option value="caterer">Caterer</option>
                        <option value="nurse">Nurse</option>
                        <option value="secretary">Secretary</option>
                        <option value="parent">Parent</option>
                        <option value="student">Student</option>
                    </select>
                </div>

                <button type="submit" class="btn-login">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>

                <div class="login-error" id="loginError">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>Invalid credentials. Please try again.</span>
                </div>
            </form>

            <div class="login-footer">
                <p>Technical & Vocational Training Excellence</p>
                <p class="version">Version 3.0 | &copy; 2026</p>
            </div>
        </div>
    </div>

    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
